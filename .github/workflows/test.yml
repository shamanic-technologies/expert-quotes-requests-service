name: Test

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

jobs:
  test:
    runs-on: ubuntu-latest

    # A throwaway database, created and thrown away with the runner. The suite
    # never points at staging or at production.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: expert_quotes_requests_service_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # sslmode=disable: the runner's Postgres speaks plaintext.
      EXPERT_QUOTES_REQUESTS_SERVICE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/expert_quotes_requests_service_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from package.json `packageManager` (action-setup
      # refuses a second, different version spec).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Apply the drizzle migrations to the throwaway database, so the
      # integration tests run against the real schema and a broken migration
      # fails here rather than on the deploy's health check.
      - name: Apply migrations
        run: pnpm db:migrate

      - name: Typecheck and build
        run: pnpm build

      - name: Test
        run: pnpm test
